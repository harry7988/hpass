name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Debug
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --no-build -c Debug 2>&1 | tee test.log
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo "## dotnet test 失败输出（尾部 400 行）"
              echo '```'
              tail -400 test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

  aot:
    name: AOT smoke (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Native AOT
        run: dotnet publish src/HPass.Cli -c Release -r ${{ matrix.rid }} /p:PublishAot=true -o publish
      - name: Smoke test binary
        shell: bash
        run: |
          export HPASS_SMOKE="$RUNNER_TEMP/hpass-smoke"
          rm -rf "$HPASS_SMOKE"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then B=publish/hpass.exe; else B=publish/hpass; fi
          set -x
          "$B" version
          HPASS_PASSPHRASE=ci-pass-123 "$B" --home "$HPASS_SMOKE" init --no-harden
          echo ci-secret-9 | HPASS_PASSPHRASE=ci-pass-123 "$B" --home "$HPASS_SMOKE" set db -u root --password-stdin
          HPASS_PASSPHRASE=ci-pass-123 "$B" --home "$HPASS_SMOKE" exec -- sh -c 'echo {{db}}' | tee smoke.log | grep -F '{{db}}'
          rm -rf "$HPASS_SMOKE"
        # 诊断：失败时把输出放进 job summary（可通过公开 API 读取）
