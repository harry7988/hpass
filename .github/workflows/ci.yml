name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Debug
      - name: Test
        shell: bash
        run: dotnet test --no-build -c Debug 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Publish failure diagnostics
        if: failure()
        shell: bash
        run: |
          git config user.name ci-bot && git config user.email ci@hpass.local
          mkdir -p diagnostics
          cp test.log "diagnostics/test-${{ matrix.os }}.log"
          git add diagnostics
          git commit -m "diag: ${{ matrix.os }}"
          git push origin HEAD:ci-diag/${{ matrix.os }}

  aot:
    name: AOT smoke (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Native AOT
        run: dotnet publish src/HPass.Cli -c Release -r ${{ matrix.rid }} /p:PublishAot=true -o publish
      - name: Smoke test binary
        shell: bash
        run: |
          {
            echo "== env =="
            uname -a || ver
            command -v sh bash pwsh cmd 2>/dev/null || true
            echo "== run =="
            export HPASS_SMOKE="$RUNNER_TEMP/hpass-smoke"
            rm -rf "$HPASS_SMOKE"
            if [ "${{ matrix.rid }}" = "win-x64" ]; then B=publish/hpass.exe; else B=publish/hpass; fi
            set -x
            "$B" version
            HPASS_PASSPHRASE=ci-pass-123 "$B" --home "$HPASS_SMOKE" init --no-harden
            echo ci-secret-9 | HPASS_PASSPHRASE=ci-pass-123 "$B" --home "$HPASS_SMOKE" set db -u root --password-stdin
            HPASS_PASSPHRASE=ci-pass-123 "$B" --home "$HPASS_SMOKE" exec -- sh -c 'echo {{db}}' | tee -a smoke.log | grep -F '{{db}}'
            grep_exit=$?
            set +x
            rm -rf "$HPASS_SMOKE"
            exit $grep_exit
          } 2>&1 | tee smoke-full.log
          exit ${PIPESTATUS[0]}
      - name: Publish failure diagnostics
        if: failure()
        shell: bash
        run: |
          git config user.name ci-bot && git config user.email ci@hpass.local
          mkdir -p diagnostics
          cp smoke-full.log "diagnostics/aot-${{ matrix.rid }}.log" 2>/dev/null || true
          git add diagnostics || true
          git commit -m "diag: aot-${{ matrix.rid }}" || true
          git push origin HEAD:ci-diag/aot-${{ matrix.rid }}
