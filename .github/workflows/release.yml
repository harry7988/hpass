name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 用原生 arm runner（公开仓库免费），osx-x64 在 arm mac 上交叉编译；
          # arm64 runner 标记 continue-on-error，个别平台问题不阻塞 Release（产物缺哪个会在 Release 里少哪个）
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, flaky: true }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64, flaky: true }
    continue-on-error: ${{ matrix.flaky == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Native AOT
        shell: bash
        run: dotnet publish src/HPass.Cli -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o publish
        # 注意：此步骤为 bash，-p: 形式避免 Windows 上 MSYS 把 /p: 当 POSIX 路径转换
      - name: Pack
        shell: bash
        run: |
          cd publish
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a "../hpass-${{ matrix.rid }}.zip" hpass.exe
          else
            tar czf "../hpass-${{ matrix.rid }}.tar.gz" hpass
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hpass-${{ matrix.rid }}
          path: hpass-${{ matrix.rid }}.*

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hpass-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum hpass-* | tee SHA256SUMS && ls -la
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          cat > release-notes.md <<'EOF'
          Native AOT 单文件二进制（macOS arm64/x64、Linux x64/arm64、Windows x64/arm64）。

          ## 安装
          1. 下载对应平台压缩包，校验：`shasum -a 256 --check SHA256SUMS --ignore-missing`
          2. 解压后放入 PATH（如 /usr/local/bin）
          3. AI 部署 runbook：docs/ai-deploy-guide.md；AI Skill 安装：skills/hpass/install.sh

          ## 快速上手
          hpass init → hpass set db -t database -u root -T prod → hpass exec -- mysql -u {{db.user}} -p{{db}} …
          （密码只在加密库与子进程间流动，永不进入 AI 对话上下文）
          EOF
          sed -i 's/^          //' release-notes.md
          echo "TAG=$TAG"; ls dist
          gh release create "$TAG" dist/* --title "hpass $TAG" --generate-notes --notes-file release-notes.md 2>&1 | tee gh-release.log
          exit ${PIPESTATUS[0]}
      - name: Publish failure diagnostics
        if: failure()
        run: |
          git config user.name ci-bot && git config user.email ci@hpass.local
          mkdir -p diagnostics
          cp gh-release.log diagnostics/ 2>/dev/null || true
          git add diagnostics || true
          git commit -m "diag: release-create" || true
          git push --force origin HEAD:ci-diag/release
